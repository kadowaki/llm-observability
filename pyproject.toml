[project]
name = "llm-observability"
version = "0.1.0"
description = "gihyo.jp Python Monthly Topics 2026年8月号 サンプルコード"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai==2.22.0",
    "logfire==4.39.0",
]

[tool.uv]
# サンプルコードを置くだけでパッケージとしては配布しないため、
# ビルド対象にしない（これがないと src/llm_observability/__init__.py を要求される）
package = false
